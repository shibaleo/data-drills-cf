name = "data-drills-cf"
main = "dist/_worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat_v2"]

# 非機密 config は src/lib/public-config.ts (git 追跡・ビルド焼き込み) に集約。
# ここには秘密も非機密の [vars] も置かない。実行時 secret は Worker Secret (wrangler secret put)。

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "10aa89de790d4ad8b16c0d24b023c365"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
